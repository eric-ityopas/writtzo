<!DOCTYPE html>
<html>
<head>
<title>sunny day</title>
</head>
<body>

<style>
body {background: radial-gradient(circle,rgba(34, 193, 195, 1) 0%, rgba(45, 139, 253, 1) 100%);}

.sun {
height: 150px;
width: 150px;
border-radius: 100%;
background: radial-gradient(circle,rgba(253, 126, 29, 1) 30%, rgba(252, 176, 69, 1) 100%);
border: 2px solid #f5ca4f;
margin: auto;
}

.cloud {
height: 60px;
width: 120px;
background: #daeef5;
background: radial-gradient(circle, rgba(218, 238, 245, 1) 0%, rgba(148, 187, 233, 1) 100%);
border-radius: 100%;
margin: 30px
}

.cloud2 {
height: 60px;
width: 120px;
background: #daeef5;
background: radial-gradient(circle, rgba(218, 238, 245, 1) 0%, rgba(148, 187, 233, 1) 100%);
border-radius: 100%;
margin: auto
}

.dirt {
height: 400px;
width: 100%;
background: #117A65;
background: linear-gradient(90deg, rgba(17, 122, 101, 1) 0%, rgba(87, 199, 133, 1) 50%);
border-radius: 35%;
margin: auto;
}


</style>

<div class="sun"></div>

<div class="cloud"></div>

<div class="cloud2"></div>

<p style="opacity: 0; font-size: 20px"></p>

<div class="dirt"></div>


</body>
</html>
